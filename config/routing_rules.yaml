routing:
  abuse_detected_route: REFUSE
  no_policy_found_route: ESCALATE
  low_groundedness_route: ESCALATE
  missing_required_fields_route: ASK_INFO

refund_rules:
  refund_window_days: 7
  repeated_request_window_days: 90
  allow_refund_within_window: true
  deny_refund_after_window: true
  abuse_language_keywords:      # distinguishes REFUSE (refund abuse) from ESCALATE (plain repeat request)
    - "keep asking"
    - "won't stop"
    - "no matter what"
    - "every day"
    - "already used"

escalation_keywords:            # turns KB "escalate on X" guidance into a checkable rule
  subscription_cancellation:
    - "dispute"
    - "charged twice"
    - "billed twice"
    - "double charge"
    - "unauthorized"
    - "didn't cancel"
    - "thought i had cancelled"
  troubleshooting:
    - "billed twice"
    - "charged twice"
    - "double charge"
    - "dispute"
  login_access:
    - "suspicious"
    - "don't recognize"
    - "unauthorized"
    - "someone else"
    - "without permission"
    - "compromised"

classification:
  sentiment_labels:
    - positive
    - neutral
    - negative
    - abusive
  urgency_levels:
    - low
    - medium
    - high
