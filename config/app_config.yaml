app:
  name: support-triage-agent
  environment: dev
  allow_auto_send: false
  pii_redaction_enabled: true
  audit_log_path: outputs/audit_log.jsonl
  reviewer_mode: cli_stub
  max_retrieval_attempts: 2
  # Raw FAISS cosine-similarity score against all-MiniLM-L6-v2 embeddings of
  # short KB chunks, NOT a 0-1 "confidence" scale -- empirically this KB's
  # genuinely-answerable tickets score ~0.31-0.65 and genuinely out-of-scope
  # tickets score ~0.17-0.26, so 0.28 is calibrated to that observed gap.
  groundedness_threshold: 0.28
  # LLM-as-judge score (§4.2) on a genuine 0-1 confidence scale -- distinct
  # from the raw retrieval-similarity groundedness_score above. Used by the
  # Phase 2 confidence_recheck node as a stricter, draft-text-level check.
  llm_groundedness_threshold: 0.75
  reviewer_db_path: outputs/triage.db
  categories:
    - refund_request
    - subscription_cancellation
    - login_access
    - troubleshooting
    - abusive_content
    - other
  required_fields:
    refund_request:
      - order_id
    subscription_cancellation:
      - subscription_id
    login_access:
      - account_id
  refusal_templates:
    abusive: "I can't help with abusive or threatening requests."
    refund_abuse: "I can't assist with refund abuse or repeated refund requests outside the policy."
